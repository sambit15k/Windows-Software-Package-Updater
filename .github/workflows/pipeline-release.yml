name: Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Package Release Assets
        run: |
          mkdir assets
          cp Update-InstalledPackages.ps1 assets/
          cp README.md assets/
          cp logo.jpg assets/
          if [ -f winget-upgrade-exclusions.jsonc ]; then cp winget-upgrade-exclusions.jsonc assets/; fi
          if [ -f winget-upgrade-exclusions.json ]; then cp winget-upgrade-exclusions.json assets/; fi
          
          # Create a specific zip name with the tag
          zip -r Windows-Software-Package-Updater-${{ github.ref_name }}.zip assets
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            Windows-Software-Package-Updater-${{ github.ref_name }}.zip
            Update-InstalledPackages.ps1
            winget-upgrade-exclusions.jsonc
            logo.jpg
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Slack Notification
        continue-on-error: true
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: 'New Release Published'
          SLACK_MESSAGE: "Release ${{ github.ref_name }} has been published successfully."
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_Footer: 'Windows-Software-Package-Updater'
